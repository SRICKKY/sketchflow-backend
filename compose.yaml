services:
  backend:
    build: .
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: postgresql://sketchflow:local-development-only@postgres:5432/sketchflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-compose-local-development-only-change-before-deployment}
      JWT_SESSION_DAYS: ${JWT_SESSION_DAYS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PUBLIC_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
      ASSET_STORAGE_DIR: /app/uploads
      S3_BUCKET: ${S3_BUCKET:-sketchflow-assets}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: http://silo:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sketchflow}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-silo-development-only}
      RUST_LOG: ${RUST_LOG:-sketchflow_backend=debug,tower_http=info}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      silo:
        condition: service_healthy
    restart: unless-stopped
    init: true

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: sketchflow
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: sketchflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sketchflow -d sketchflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_UPDATE: "off"
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-sketchflow}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-local-silo-development-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    init: true

  silo-init:
    profiles: ["setup"]
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mcli alias set local http://silo:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mcli mb --ignore-existing "local/$$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-sketchflow}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-local-silo-development-only}
      S3_BUCKET: ${S3_BUCKET:-sketchflow-assets}
    restart: "no"

volumes:
  postgres_data:
  uploads:
  minio_data:
